[project]
name = "api"
version = "0.1.0"
description = "FastAPI backend inside a Turborepo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn>=0.31.0",
    "alembic>=1.13.0",
    "pymysql>=1.1.0",
    "pydantic-settings>=2.0.0",
]

[tool.ruff]
# Optional: Configuration for Ruff linter/formatter if you use it
line-length = 88
select = ["E", "F", "I"]
